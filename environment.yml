name: DEFRAGMO
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.7
  - pytorch::pytorch=2.0
  - nvidia::cuda-toolkit=11.8
  - numpy=1.26.3
  - pandas=2.1.4
  - scipy=1.12.0
  - scikit-learn=1.4.0
  - matplotlib=3.8.2
  - seaborn=0.13.2
  - networkx=3.1
  - tqdm=4.65.0
  - pyyaml=6.0.1
  - tensorboard=2.16.2
  - ipykernel=6.29.1
  - pytest=8.4.1
  - ruff
  - mypy
  - pip:
      - rdkit==2023.9.4
      - tensorboardx==2.6.2.2
      - gensim==4.3.2
      - smart-open==6.4.0
      - git+https://github.com/panukorn17/mol2vec
